name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Generate map bundle and icons
        run: npm run generate

      - name: Generate native Android project
        run: npx expo prebuild -p android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: lean-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk lean.apk
          gh release create "build-${{ github.run_number }}" lean.apk --title "Lean build ${{ github.run_number }}" --notes "Automatic build of ${{ github.sha }}"
